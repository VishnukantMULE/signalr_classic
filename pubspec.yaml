name: signalr_classic
description: >-
  Pure-Dart client for classic ASP.NET SignalR 2.x hubs: WebSockets, SSE and Long Polling,
  auto-reconnect, and a drop-in replacement for signalr_flutter.
version: 1.0.0
repository: https://github.com/VishnukantMULE/signalr_classic
issue_tracker: https://github.com/VishnukantMULE/signalr_classic/issues
topics:
  - signalr
  - websocket
  - realtime
  - networking

# Lower bound 2.18 keeps the code usable from projects still on Dart 2.18
# language level (no records, patterns, sealed or class modifiers are used).
environment:
  sdk: ">=2.18.0 <4.0.0"

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

dev_dependencies:
  lints: ">=2.0.0 <7.0.0"
  test: ^1.25.0
